registry_version: 1
governance_state:
  classification_only: false
  activated_dispatcher: true
  current_development_runner:
    script: operations/validate.R
    arguments:
      - --profile
      - source-changed
  current_checkpoint_runner:
    script: operations/validate.R
    arguments:
      - --profile
      - legacy-v0.1-checkpoint

protected_invariants:
  - invariant_id: specification_canonical_validity
    description: Specifications and canonical handoffs retain valid identity, relationship, and temporal declarations.
  - invariant_id: temporal_correctness
    description: Runtime and providers cannot use information unavailable at the declared as-of time.
  - invariant_id: history_integrity
    description: Operational history preserves atomic append, retry, conflict, invalidation, and restatement semantics.
  - invariant_id: privacy_secret_protection
    description: Repository content and ordinary diagnostics exclude PHI, credentials, and unsafe patient-level context.
  - invariant_id: dependency_integrity
    description: Dependency ownership, compatibility, and declared closure remain explicit and validated.
  - invariant_id: artifact_integrity
    description: Application artifacts and target realizations preserve closed inventory, integrity, and boundary separation.
  - invariant_id: release_immutability
    description: Published releases and their evidence are immutable and exact.
  - invariant_id: publication_authorization_recovery
    description: Publication remains explicit, fail-closed, recoverable, and independently verified.
  - invariant_id: documentation_authority
    description: Maintained documentation links and authority relationships remain coherent and portable.
  - invariant_id: destructive_operation_safety
    description: Mutating lifecycle operations retain explicit targets, no-overwrite rules, and safe recovery.

validators:
  - validator_id: repository.validation-governance
    owner_boundary: validation_governance
    lifecycle_scope: source
    status: active_global
    invariant:
      - documentation_authority
      - destructive_operation_safety
    runner:
      script: tests/run-governance-tests.R
      arguments: []
    trigger_paths:
      exact:
        - validation/ownership.yml
        - tests/run-governance-tests.R
        - operations/validate.R
        - operations/validate-current-boundary.R
        - operations/validate-legacy.R
        - operations/validate-repository-policy.R
      prefixes:
        - validation/
        - tests/governance/
      suffixes: []
    prerequisites: []
    transition_ledger_id: validation-phase-controls
    current_checks:
      - tests/run-governance-tests.R
      - validation/R/ownership.R
      - validation/R/dispatcher.R
      - validation/R/current-boundary.R
      - operations/validate.R
      - operations/validate-current-boundary.R
      - operations/validate-legacy.R

  - validator_id: repository.documentation
    owner_boundary: documentation
