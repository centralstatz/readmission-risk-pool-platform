# Closed authority for non-code resources intended for the future RRP software distribution.
catalog_kind: installed_resource_catalog
catalog_id: rrp.installed-resources
catalog_version: "0.1.0"
catalog_format_version: "1.0.0"
schema:
  specification_id: platform.installed-resource-catalog-schema
  specification_version: "0.1.0"
status: development_unpublished
product:
  product_id: readmission-risk-pool-platform
  development_version: 0.2.0-dev
  distribution_status: not_built
limitations:
  supported_installation: false
  clinical_use: prohibited
  hospital_project: false
  final_release_payload: false
resource_id_convention: >-
  Dot-separated rrp.<role-family>.<logical-name> identities describe stable
  logical resources and do not encode their current repository location.

