excluded_resource_families:
  - family_id: rrp.exclusion.connect-target
    classification: deferred_target
    source_paths:
      - contracts/deployment/connect-cloud-realization.yml
      - deploy/connect-cloud
    reason: Connect-specific realization remains assigned to Stage 8.
    future_stage: stage_8

  - family_id: rrp.exclusion.repository-configuration
    classification: repository_configuration
    source_paths:
      - config
      - implementations/persistence/duckdb/config/reference.yml
    reason: Repository instance and local DuckDB paths are not installed resources.
    future_stage: stage_3_or_4

  - family_id: rrp.exclusion.tests-and-fixtures
    classification: test_evidence
    source_paths:
      - tests
      - contracts/examples
      - contracts/canonical/examples
    reason: Development tests and fixtures are not installed software resources.
    future_stage: not_applicable

  - family_id: rrp.exclusion.validation-and-ci
    classification: validation_governance
    source_paths:
      - .git
      - validation
      - .github
      - .gitignore
    reason: Repository validation ownership and hosted CI remain development controls.
    future_stage: not_applicable

  - family_id: rrp.exclusion.architecture-development
    classification: architecture_development
    source_paths:
      - docs/architecture/application-artifact-foundation.md
      - docs/architecture/canonical-bundle-foundation.md
      - docs/architecture/canonical-clinical-profile.md
      - docs/architecture/canonical-producer-foundation.md
      - docs/architecture/connect-cloud-realization.md
      - docs/architecture/distribution-release-assessment.md
      - docs/architecture/duckdb-reference-persistence.md
      - docs/architecture/estimand-composition-project-registration-assessment.md
      - docs/architecture/governance-validation-architecture-assessment.md
      - docs/architecture/hospital-implementation-distribution-assessment.md
      - docs/architecture/installed-software-project-contract-assessment.md
      - docs/architecture/installed-software-project-model-assessment.md
      - docs/architecture/logical-product-foundation.md
      - docs/architecture/observability-foundation.md
      - docs/architecture/open-decisions.md
      - docs/architecture/operational-history-foundation.md
      - docs/architecture/platform-implementation-plan.md
      - docs/architecture/platform-implementation-record.md
      - docs/architecture/provider-foundation.md
      - docs/architecture/readmission-risk-target-assessment.md
      - docs/architecture/reference-application.md
      - docs/architecture/reference-asset-reconciliation.md
      - docs/architecture/reference-product-materialization.md
      - docs/architecture/release-license-review.md
      - docs/architecture/runtime-foundation.md
      - docs/architecture/software-distribution-build-reproducibility-assessment.md
      - docs/architecture/specification-foundation.md
      - docs/architecture/synthetic-reference-implementation.md
    reason: Assessments, implementation plans, records, and component history remain development evidence.
    future_stage: stage_9

  - family_id: rrp.exclusion.repository-guidance
    classification: architecture_development
    source_paths:
      - AGENTS.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - docs/README.md
      - docs/START-HERE.md
      - docs/adoption
      - docs/development
      - products/README.md
    reason: Contributor, adoption, navigation, and development governance do not ship.
    future_stage: stage_9

  - family_id: rrp.exclusion.maintainer-operations
    classification: maintainer_operations
    source_paths:
      - operations
      - docs/operations
    reason: Repository operations are not installed operations or resources.
    future_stage: stage_3

  - family_id: rrp.exclusion.development-environment
    classification: development_environment
    source_paths:
      - .Rprofile
      - .editorconfig
      - .renvignore
      - renv
      - renv.lock
    reason: Root dependency state remains repository-development authority only.
    future_stage: stage_2_increment_2e

  - family_id: rrp.exclusion.hospital-delivery
    classification: historical_delivery
    source_paths:
      - contracts/distribution
      - distribution/hospital
    reason: Hospital delivery is immutable v0.1.0 history, not the RRP 1.0 payload.
    future_stage: stage_9

  - family_id: rrp.exclusion.release-evidence
    classification: release_evidence
    source_paths:
      - LICENSE-STATUS.md
      - RELEASE.yml
      - releases
    reason: Release and publication state remains outside the development payload.
    future_stage: stage_10

  - family_id: rrp.exclusion.generated-state
    classification: generated_state
    source_paths:
      - build
    reason: Generated build state is never a catalog source.
    future_stage: not_applicable

deferred_resource_roles:
  - role_id: rrp.deferred.project-template
    planned_stage: stage_4
    reason: No independent-project template exists; this catalog does not invent one.
