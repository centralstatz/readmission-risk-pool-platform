# Closed schema for the RRP installed-resource catalog.
specification_kind: installed_resource_catalog_schema
specification_id: platform.installed-resource-catalog-schema
specification_version: "0.1.0"
specification_format_version: "1.0.0"
identity_scope: platform
title: RRP installed-resource catalog schema
status: active
description: >-
  Closed declarative schema for the non-code resources owned by the RRP
  software boundary before an installed distribution or accessor exists.

catalog_contract:
  catalog_kind: installed_resource_catalog
  catalog_id: rrp.installed-resources
  catalog_version: "0.1.0"
  catalog_format_version: "1.0.0"
  status_values:
    - development_unpublished
  required_top_level_fields:
    - catalog_kind
    - catalog_id
    - catalog_version
    - catalog_format_version
    - schema
    - status
    - product
    - limitations
    - resource_id_convention
    - resources
    - excluded_resource_families
    - deferred_resource_roles
  allowed_top_level_fields:
    - catalog_kind
    - catalog_id
    - catalog_version
    - catalog_format_version
    - schema
    - status
    - product
    - limitations
    - resource_id_convention
    - resources
    - excluded_resource_families
    - deferred_resource_roles
  schema_reference_fields:
    - specification_id
    - specification_version
  product_fields:
    - product_id
    - development_version
    - distribution_status
  limitation_fields:
    - supported_installation
    - clinical_use
    - hospital_project
    - final_release_payload

resource_entry_contract:
  required_fields:
    - resource_id
    - role
    - owner
    - source_path
    - output_path
    - required
    - format
    - compatibility
  allowed_fields:
    - resource_id
    - role
    - owner
    - source_path
    - output_path
    - required
    - format
    - compatibility
  resource_id_pattern: "^rrp[.][a-z0-9]+(?:[.][a-z0-9-]+)+$"
  allowed_roles:
    - normative_contract
    - implementation_declaration
    - application_identity
    - artifact_dependency_declaration
    - fictional_reference
    - normative_documentation
    - distribution_guidance
    - legal_license
    - legal_notice
    - security_guidance
    - support_guidance
  allowed_owners:
    - platform.contracts
    - rrp.supplied-adapters
    - rrp.supplied-application
    - reference.synthetic-source
    - rrp.product
    - rrp.software-distribution
  allowed_formats:
    - yaml
    - markdown
    - text
    - apache-2.0-license
  compatibility_fields:
    - status
    - note
  compatibility_status_values:
    - current
    - transitional_daily_hazard
    - fictional_nonclinical
    - development_unpublished

excluded_family_contract:
  required_fields:
    - family_id
    - classification
    - source_paths
    - reason
    - future_stage
  allowed_fields:
    - family_id
    - classification
    - source_paths
    - reason
    - future_stage
  family_id_pattern: "^rrp[.]exclusion[.][a-z0-9-]+$"
  allowed_classifications:
    - deferred_target
    - repository_configuration
    - test_evidence
    - validation_governance
    - architecture_development
    - maintainer_operations
    - development_environment
    - historical_delivery
    - release_evidence
    - generated_state

deferred_role_contract:
  required_fields:
    - role_id
    - planned_stage
    - reason
  allowed_fields:
    - role_id
    - planned_stage
    - reason
  role_id_pattern: "^rrp[.]deferred[.][a-z0-9-]+$"

path_rules:
  relative_only: true
  forward_slashes_only: true
  dot_segments_prohibited: true
  parent_segments_prohibited: true
  linked_sources_prohibited: true
  required_sources_must_be_regular_files: true
  allowed_output_roots:
    - resources
    - docs
    - legal
  forbidden_shipped_source_prefixes:
    - .git
    - .github
    - build
    - config
    - distribution/hospital
    - docs/development
    - docs/operations
    - operations
    - releases
    - renv
    - tests
    - validation
  forbidden_shipped_sources:
    - .Rprofile
    - .editorconfig
    - .gitignore
    - .renvignore
    - AGENTS.md
    - CHANGELOG.md
    - CONTRIBUTING.md
    - LICENSE-STATUS.md
    - RELEASE.yml
    - products/README.md
    - renv.lock
    - contracts/deployment/connect-cloud-realization.yml
    - contracts/distribution/hospital-implementation-distribution.yml
    - contracts/distribution/hospital-implementation-git-realization.yml
    - implementations/persistence/duckdb/config/reference.yml

cross_entry_invariants:
  unique_resource_ids: true
  unique_source_paths: true
  unique_output_paths: true
  case_folded_output_paths_unique: true
  file_directory_output_conflicts_prohibited: true
  shipped_and_excluded_overlap_prohibited: true
  accepted_classification_complete: true
