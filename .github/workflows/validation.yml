name: validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Validate documentation
        run: Rscript operations/validate-documentation.R
      - name: Validate checkpoint
        run: Rscript operations/validate.R --mode checkpoint
