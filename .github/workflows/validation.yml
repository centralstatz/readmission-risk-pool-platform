name: validation

"on":
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: Exact historical v0.1.0 regression profile
        required: true
        type: choice
        options:
          - legacy-v0.1-development
          - legacy-v0.1-checkpoint

permissions:
  contents: read

jobs:
  checkpoint:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Validate active forward source
        run: Rscript operations/validate.R --profile ci-active

  legacy-regression:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Validate exact legacy development aggregate
        if: inputs.profile == 'legacy-v0.1-development'
        run: Rscript operations/validate.R --profile legacy-v0.1-development
      - name: Validate exact legacy checkpoint aggregate
        if: inputs.profile == 'legacy-v0.1-checkpoint'
        run: Rscript operations/validate.R --profile legacy-v0.1-checkpoint
      - name: Reject unsupported legacy profile
        if: inputs.profile != 'legacy-v0.1-development' && inputs.profile != 'legacy-v0.1-checkpoint'
        run: |
          echo "Unsupported legacy validation profile." >&2
          exit 2
